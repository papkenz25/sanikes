<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SANIKES by Papkenz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="layar-login" class="tengah" hidden>
  <main class="kartu">
    <p class="logo">SANIKES</p>
    <p class="sub">by Papkenz · Input sekali, semua laporan</p>
    <form id="form-login">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="pin">PIN / Kata sandi</label>
      <input id="pin" type="password" autocomplete="current-password" required>
      <button type="submit" id="tombol-masuk">Masuk</button>
      <div class="pesan" id="pesan-login"></div>
    </form>
  </main>
</div>

<div id="layar-app" hidden>
  <header class="atas">
    <div><b>SANIKES</b><small id="info-fasyankes"></small></div>
    <button class="kecil" id="tombol-keluar">Keluar</button>
  </header>
  <main id="isi"></main>
  <nav class="bawah">
    <button data-tab="dasbor" class="aktif">Dasbor</button>
    <button data-tab="catat">Catat</button>
    <button data-tab="modul">Modul</button>
    <button data-tab="laporan">Laporan</button>
    <button data-tab="data">Data</button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="dasbor.js?v=5"></script>
<script src="akun.js?v=1"></script>
<script src="limbah.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="label.js"></script>
<script src="modul.js?v=6"></script>
<script src="kelola.js?v=2"></script>
<script src="tindaklanjut.js?v=2"></script>
<script src="pengaturan.js?v=3"></script>
<script src="air.js?v=2"></script>
<script src="vektor.js?v=2"></script>
<script src="udara.js?v=1"></script>
<script src="sanitasi.js?v=1"></script>
<script src="cek.js?v=2"></script>
<script src="k3.js?v=1"></script>
<script src="lain.js?v=1"></script>
<script src="data.js?v=3"></script>
<script src="angkut.js?v=2"></script>
<script src="neraca.js"></script>
<script src="ekspor-format.js"></script>
<script src="ekspor.js"></script>
</body>
</html>
